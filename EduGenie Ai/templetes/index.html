<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="EduGenie - Google Gemini Powered Learning Assistant"
    >

    <title>EduGenie - AI Learning Assistant</title>

    <link rel="icon" href="/favicon.ico" type="image/svg+xml">

    <link
        rel="stylesheet"
        href="/static/style.css"
    >

</head>


<body>

<main class="container">

    <!-- =================================================
         Header
    ================================================== -->

    <header class="hero">

        <div class="eyebrow">
            AI-POWERED LEARNING ASSISTANT
        </div>

        <h1>
            EduGenie
        </h1>

        <p>
            Ask questions, simplify concepts,
            generate quizzes, summarize lessons,
            and create personalized learning paths.
        </p>

    </header>


    <!-- =================================================
         Main application card
    ================================================== -->

    <section class="card">

        <label for="task">
            Learning Task
        </label>

        <select id="task">

            <option value="qa">
                Ask a Question
            </option>

            <option value="explain">
                Explain a Concept
            </option>

            <option value="quiz">
                Generate a Quiz
            </option>

            <option value="summarize">
                Summarize Text
            </option>

            <option value="learn">
                Learning Path
            </option>

        </select>


        <!-- =================================================
             Learner level
        ================================================== -->

        <label for="level">
            Learner Level
        </label>

        <select id="level">

            <option value="beginner">
                Beginner
            </option>

            <option value="intermediate">
                Intermediate
            </option>

            <option value="advanced">
                Advanced
            </option>

        </select>


        <!-- =================================================
             Weeks
        ================================================== -->

        <label
            for="weeks"
            id="weeksLabel"
            class="hidden"
        >
            Learning Plan Length
        </label>

        <input
            id="weeks"
            class="hidden"
            type="number"
            min="1"
            max="52"
            value="6"
        >


        <!-- =================================================
             User input
        ================================================== -->

        <label
            for="inputText"
            id="inputLabel"
        >
            Your Question
        </label>

        <textarea
            id="inputText"
            rows="9"
            placeholder="Example: Which is the largest ocean?"
        ></textarea>


        <!-- =================================================
             Submit button
        ================================================== -->

        <button
            id="submitBtn"
            type="button"
        >
            Generate
        </button>

    </section>


    <!-- =================================================
         Status
    ================================================== -->

    <section
        id="status"
        class="status"
        aria-live="polite"
    ></section>


    <!-- =================================================
         Result
    ================================================== -->

    <section
        id="result"
        class="result card hidden"
    ></section>

</main>


<script src="/static/app.js"></script>

</body>

</html>
